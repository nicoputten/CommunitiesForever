name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      # Up to 3 attempts: a LuaRocks mirror hiccup should not fail the build.
      - name: Install busted and luacheck
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed: $*"; sleep 15; done; return 1; }
          retry luarocks install busted
          retry luarocks install luacheck

      - name: Fetch libraries (LibSerialize, LibDeflate are used by specs)
        shell: pwsh
        run: ./tools/fetch-libs.ps1

      - name: Lint
        run: luacheck src tests

      - name: Test
        run: busted

  # CF-84: packages with the real packager (no upload, no externals, no zip) and checks the layout CurseForge and
  # Wago get: the addon and the CommunitiesForever_Vault folder side by side, both TOCs with the version filled in.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the packager reads the history for the version

      - name: Release notes placeholder (.pkgmeta manual-changelog)
        run: echo "Dry run" > RELEASE_NOTES.md

      - name: Package (dry run)
        uses: BigWigsMods/packager@v2
        with:
          args: -d -e -z

      - name: Check the packaged folders
        run: |
          set -e
          ls .release
          test -f .release/CommunitiesForever/CommunitiesForever.toc
          test -f .release/CommunitiesForever_Vault/CommunitiesForever_Vault.toc
          test -f .release/CommunitiesForever_Vault/Vault.lua
          test ! -e .release/CommunitiesForever/CommunitiesForever_Vault
          grep -q "## SavedVariables: CommunitiesForeverVaultDB" .release/CommunitiesForever_Vault/CommunitiesForever_Vault.toc
          ! grep -q "@project-version@" .release/CommunitiesForever_Vault/CommunitiesForever_Vault.toc
          ! grep -q "@project-version@" .release/CommunitiesForever/CommunitiesForever.toc
