name: package

# Builds the release package exactly like the release workflow (BigWigs packager, .pkgmeta) but does NOT
# upload: the zip is kept as a download on the run page (Artifacts). For checking a package before or
# after a release.
#   Run it: push a branch "package/<tag or ref>" (e.g. package/v0.2.0-beta1), or from the Actions tab
#   ("Run workflow") with the ref to package.
on:
  push:
    branches:
      - "package/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to package (e.g. v0.2.0-beta1)"
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the packager reads tags and history for the version

      - name: Check out the ref to package
        run: |
          ref="${{ inputs.ref }}"
          [ -z "$ref" ] && ref="${GITHUB_REF_NAME#package/}"
          echo "Packaging $ref"
          git checkout --quiet "$ref"

      # The same packager script as the release (v2), called directly: on a branch push the packager action
      # skips commits that carry a tag ("Found future tag"), so it runs here as a manual event. No
      # CF_API_TOKEN here, and -d skips every upload.
      - name: Package (no upload)
        run: |
          sudo apt-get install -y -qq subversion > /dev/null
          curl -fsSL -o /tmp/release.sh https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh
          GITHUB_EVENT_NAME=workflow_dispatch bash /tmp/release.sh -d

      - name: Keep the zip as a download
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true # .release starts with a dot
